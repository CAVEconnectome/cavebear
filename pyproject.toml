[project]
name = "cavebear"
version = "0.0.1"
description = "Specs and reference implementations for interacting with CAVE data lakehouse table layouts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # 1.6 is the version that tests/test_delta_configuration.py checks.
    "deltalake>=1.6",
    "mmh3",
    "numpy>=1.26",
    # RecordBatchReader.from_stream needs pyarrow 15.
    "pyarrow>=15",
]

[project.optional-dependencies]
polars = [
    # Older versions fail with deltalake 1.6, or do not skip files in scan_delta (1.31).
    # 1.35.0 has no runtime package on PyPI.
    "polars>=1.35.1",
]
duckdb = ["duckdb>=2.0"]

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "polars>=2.1.0",
    "pyiceberg-core",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
